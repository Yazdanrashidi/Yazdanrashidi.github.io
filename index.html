<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Homepage</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <div class="hero">

        <div class="line"></div>

        <h1>YAZDAN RASHIDI</h1>

        <p>Ph.D. in Biophysics</p>
        <p>Postdoctoral Research Fellow at the Universität des Saarlandes</p>

        <div class="line"></div>


        <!-- CV Button -->
        <button class="cv-button" onclick="openCV()">
            CV
        </button>


    </div>



    <!-- CV Popup -->
    <div id="cvModal" class="cv-modal">

        <div class="cv-box">

            <button class="close-button" onclick="closeCV()">
                ✕
            </button>


            <iframe 
                src="documents/CV_YazdanRashidi.pdf">
            </iframe>


        </div>

    </div>




<script>

function openCV() {
    document.getElementById("cvModal").style.display = "flex";
}


function closeCV() {
    document.getElementById("cvModal").style.display = "none";
}


// Close popup when clicking outside the CV box
window.onclick = function(event) {

    let modal = document.getElementById("cvModal");

    if (event.target == modal) {
        modal.style.display = "none";
    }

}

</script>


</body>

</html>
